# Local production-like run: API + scheduler against your .env
services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  scheduler:
    build: .
    command: ["python", "scheduler/daily_workflow.py"]
    env_file: .env
    restart: unless-stopped
    depends_on:
      - api
