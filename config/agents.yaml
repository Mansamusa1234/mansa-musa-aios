# Mansa Musa AI OS — agent registry
# The whole org chart as data. The runtime (backend/base_agent.py) reads this file;
# you scale by flipping `enabled: true`, NOT by writing new programs.
#
# Per-agent fields:
#   layer            grouping (1-10)
#   team             operations | marketing | finance | customers | executive | intelligence | automation
#   enabled          true = orchestrator may run it
#   handler          python class in backend/agents (only the Phase-1 four are implemented;
#                    others fall back to GenericAgent which drafts + logs)
#   requires_approval anything touching money/contracts/hiring -> true (never auto-runs)
#   auto_publish     social agents only; default false = DRAFT mode
#   schedule         cron-ish slot used by scheduler/daily_workflow.py (optional)

defaults:
  enabled: false
  handler: GenericAgent
  requires_approval: false
  auto_publish: false

layers:

  1_executive:
    team: executive
    agents:
      - {name: CEO Agent}
      - {name: COO Agent}
      - {name: CFO Agent}
      - {name: Marketing Director Agent}
      - {name: Operations Director Agent}
      - {name: Customer Experience Director Agent}
      - {name: Events Director Agent}
      - {name: Compliance Agent}
      - {name: Growth Agent}
      - {name: Business Intelligence Agent}

  2_operations:
    team: operations
    agents:
      - {name: Opening Checklist Agent, schedule: "06:00"}
      - {name: Closing Checklist Agent, schedule: "21:00"}
      - {name: Kitchen Manager Agent}
      - {name: Head Chef Agent}
      - {name: Food Safety Agent}
      - {name: Stock Controller Agent, handler: InventoryAgent, enabled: true, schedule: "06:00"}
      - {name: Waste Reduction Agent}
      - {name: Supplier Agent, requires_approval: true}
      - {name: Procurement Agent, requires_approval: true}
      - {name: Maintenance Agent}

  3_menu_engineering:
