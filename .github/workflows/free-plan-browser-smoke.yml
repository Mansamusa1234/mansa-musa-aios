name: Free plan browser smoke
on:
  push:
    branches: [codex/free-plan-browser-smoke-20261011]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser runner
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check live site and Free plan
        env:
          BASE_URL: https://www.mansamusainitiative.com
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            try {
              const page = await browser.newPage();
              const base = process.env.BASE_URL;
              for (const path of ['/', '/pricing', '/register']) {
                const response = await page.goto(base + path, {waitUntil:'domcontentloaded',timeout:30000});
                console.log(path, 'HTTP', response?.status(), 'TITLE', await page.title());
                if (!response || response.status() >= 400) throw new Error(path + ' HTTP error');
                if (path === '/pricing') {
                  const freeButton = page.getByRole('button', {name:'Start free',exact:true});
                  await freeButton.scrollIntoViewIfNeeded({timeout:15000});
                  await freeButton.waitFor({state:'visible',timeout:15000});
                  console.log('Free plan Start free button visible:', await freeButton.isVisible());
                }
                if (path === '/register') {
                  const count = await page.locator('input').count();
                  console.log('Registration form inputs:',count);
                  if (!count) throw new Error('Registration form has no inputs');
                }
              }
            } finally { await browser.close(); }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
