name: Free plan browser smoke
on:
  push:
    branches: [codex/free-plan-browser-smoke-20261011]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser runner
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check live site and Free plan
        env:
          BASE_URL: https://www.mansamusainitiative.com
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage();
            const base = process.env.BASE_URL;
            for (const path of ['/', '/pricing', '/signup']) {
              const response = await page.goto(base + path, {waitUntil:'domcontentloaded',timeout:30000});
              console.log(path, 'HTTP', response?.status(), 'TITLE', await page.title());
              if (!response || response.status() >= 500) throw new Error(path + ' server failure');
              if (path === '/pricing') {
                const body = await page.locator('body').innerText();
                console.log('Pricing includes Free:', /\\bfree\\b/i.test(body));
                console.log('Pricing includes £0:', /£\\s*0|0\\s*\/\\s*month/i.test(body));
                if (!/\\bfree\\b/i.test(body)) throw new Error('Free plan missing from pricing page');
              }
              if (path === '/signup') console.log('Signup form fields:', await page.locator('input').count());
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
