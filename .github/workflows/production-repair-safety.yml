name: Production repair safety gate
on:
  push:
    branches: [codex/production-completion-20261007]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repairs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci
      - name: Run repair regression suite
        run: npm run test:repairs
      - name: TypeScript validation
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
