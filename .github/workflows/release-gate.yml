name: Release gate

# Blocks a release when any security or correctness check fails. Make "Release gate / gate"
# a required status check on main (Settings → Branches) so a failing PR cannot be merged.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: localtest
          POSTGRES_DB: mansa_journey
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      stripe-mock:
        image: stripe/stripe-mock:v0.205.0
        ports: ["12111:12111"]
    env:
      # Throwaway CI database only; no real credentials are available to this workflow.
      DATABASE_URL: postgresql://postgres:localtest@127.0.0.1:55432/mansa_journey
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Secret scan (tracked files)
        run: node scripts/secret-scan.mjs
      - name: Dependency audit (production dependencies, high and critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Type check
        run: npx tsc --noEmit -p .
      - name: Lint (errors fail the gate)
        run: npx eslint .
      - name: Unit and security regression tests
        run: npm run test:repairs
      - name: Subscription, tenant-isolation and Preview database guard tests (real Postgres + stripe-mock)
        run: |
          npx prisma db push --skip-generate
          npm run test:journey
      - name: Production build
        run: npm run build
        env:
          NEXTAUTH_SECRET: ci-only-not-a-secret
          AUTH_SECRET: ci-only-not-a-secret
